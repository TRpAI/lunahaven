name = "qiyue-ledger-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Cloudflare D1 边缘数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "qiyue_ledger_db"
database_id = "3652e1ff-356f-451e-b47b-ab4bdca3dad5"

# 环境变量配置
# 生产环境 API 访问 Token 建议通过命令行加密存储：
# wrangler secret put API_TOKEN
[vars]
# 允许跨域的前端来源。设为 "*" 可允许任意合法来源（依赖 API_TOKEN 严格鉴权），亦可指定如 "https://qiyuezb.pages.dev"
ALLOWED_ORIGIN = "*"
